[project]
name = "UTF-8K"
dynamic = ["version"]
description = "Unlimited UTF-8!"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/UTF-8000/UTF-8K-Python/"

[project.scripts]
utf-8k = "UTF8K.CLI:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.dynamic]
version = {attr = "UTF8K.__version__"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
