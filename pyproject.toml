[project]
name = "UTF-8000"
dynamic = ["version"]
description = "Unlimited UTF-8!"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/jb2170/UTF-8000/"

[project.scripts]
utf-8000 = "UTF8000.CLI:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.dynamic]
version = {attr = "UTF8000.__version__"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
